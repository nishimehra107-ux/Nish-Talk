<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NISH-TALK | Premium Video Chat</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap');

    :root {
      --bg-color: #09090b;
      --bg-gradient: radial-gradient(circle at 15% 50%, rgba(139, 92, 246, 0.15), transparent 40%), radial-gradient(circle at 85% 30%, rgba(217, 70, 239, 0.15), transparent 40%);
      --surface: rgba(30, 30, 35, 0.6);
      --surface-solid: #18181b;
      --text-main: #f8fafc;
      --text-muted: #a78bfa;
      --border: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(255, 255, 255, 0.15);
      --primary: #8b5cf6;
      --accent: #d946ef;
      --input-bg: rgba(0, 0, 0, 0.3);
      --shadow: 0 20px 40px -10px rgba(0,0,0,0.7);
      --chat-mine: #8b5cf6;
      --chat-other: #27272a;
      --glow: 0 0 20px rgba(139, 92, 246, 0.4);
    }

    [data-theme="light"] {
      --bg-color: #faf5ff;
      --bg-gradient: radial-gradient(circle at 15% 50%, rgba(139, 92, 246, 0.08), transparent 40%), radial-gradient(circle at 85% 30%, rgba(217, 70, 239, 0.08), transparent 40%);
      --surface: rgba(255, 255, 255, 0.75);
      --surface-solid: #ffffff;
      --text-main: #3b0764;
      --text-muted: #7e22ce;
      --border: rgba(139, 92, 246, 0.15);
      --border-hover: rgba(139, 92, 246, 0.25);
      --primary: #7c3aed;
      --accent: #c026d3;
      --input-bg: rgba(255, 255, 255, 0.9);
      --shadow: 0 20px 40px -10px rgba(59, 7, 100, 0.08);
      --chat-mine: #7c3aed;
      --chat-other: #f3e8ff;
      --glow: 0 0 20px rgba(124, 58, 237, 0.2);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; transition: background-color 0.4s ease, border-color 0.4s ease; }
    
    body {
      background-color: var(--bg-color);
      background-image: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes popIn { 0% { opacity: 0; transform: scale(0.9); } 100% { opacity: 1; transform: scale(1); } }

    .theme-toggle {
      position: absolute; top: 25px; left: 30px; z-index: 100;
      background: var(--surface); backdrop-filter: blur(10px);
      border: 1px solid var(--border); border-radius: 50%;
      width: 48px; height: 48px; cursor: pointer; display: flex; 
      justify-content: center; align-items: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .theme-toggle:hover { transform: scale(1.1) rotate(15deg); border-color: var(--border-hover); background: var(--surface-solid); box-shadow: var(--glow); }
    .theme-toggle svg { width: 22px; height: 22px; fill: none; stroke: var(--primary); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; transition: all 0.3s; }
    [data-theme="light"] .theme-toggle svg { stroke: var(--text-main); }

    .auth-container {
      background: var(--surface);
      backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border);
      padding: 45px; border-radius: 32px; width: 100%; max-width: 440px;
      box-shadow: var(--shadow); margin: 20px;
      animation: fadeInUp 0.6s ease-out forwards;
    }
    
    h2 { text-align: center; margin-bottom: 10px; font-weight: 800; font-size: 36px; letter-spacing: -1px;
         background: linear-gradient(135deg, var(--primary), var(--accent)); -webkit-background-clip: text; color: transparent; }
    .subtitle { text-align: center; color: var(--text-muted); font-size: 14px; margin-bottom: 35px; font-weight: 500; }
    
    .tabs { display: flex; margin-bottom: 30px; background: var(--input-bg); border-radius: 16px; padding: 6px; border: 1px solid var(--border); }
    .tabs button { flex: 1; padding: 12px; border: none; background: transparent; color: var(--text-muted); font-weight: 600; font-size: 15px; cursor: pointer; border-radius: 12px; transition: 0.3s; }
    .tabs button.active { background: var(--surface-solid); color: var(--text-main); box-shadow: 0 4px 15px rgba(0,0,0,0.1); }

    input { width: 100%; padding: 16px 18px; margin-bottom: 18px; border: 1px solid var(--border);
      border-radius: 16px; background: var(--input-bg); color: var(--text-main); font-size: 15px; font-weight: 500; transition: 0.3s; }
    input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.15); }
    
    button.submit { 
      width: 100%; padding: 16px; border: none; border-radius: 16px; font-size: 16px; font-weight: 700; 
      cursor: pointer; margin-top: 10px; transition: 0.3s; color: #fff;
      background: linear-gradient(135deg, var(--primary), var(--accent)); 
      box-shadow: 0 8px 25px -8px var(--primary);
    }
    button.submit:hover { transform: translateY(-2px); box-shadow: 0 12px 30px -8px var(--primary), var(--glow); }
    button.submit:active { transform: scale(0.98); }
    
    .message { margin-top: 16px; padding: 14px; border-radius: 14px; font-size: 14px; font-weight: 600; display: none; text-align: center; animation: popIn 0.3s ease; }
    .message.error { background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid rgba(239,68,68,0.2); display: block; }
    .message.success { background: rgba(34, 197, 94, 0.15); color: #16a34a; border: 1px solid rgba(34,197,94,0.2); display: block; }
    
    .hidden { display: none !important; }

    .dashboard { text-align: center; padding: 45px; }
    .user-email { color: var(--primary); font-weight: 700; font-size: 15px; margin-bottom: 35px; display: inline-block; padding: 8px 16px; background: rgba(139, 92, 246, 0.1); border-radius: 20px; border: 1px solid rgba(139, 92, 246, 0.2); animation: popIn 0.4s ease; }
    
    .action-btn { padding: 16px 30px; border: none; border-radius: 16px; font-size: 16px; font-weight: 700; cursor: pointer; transition: 0.3s; margin: 12px 0; width: 100%; max-width: 320px; display: inline-block; }
    .btn-start { background: var(--surface-solid); color: var(--text-main); box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid var(--border); }
    .btn-start:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,0.1), var(--glow); border-color: var(--primary); }
    .btn-start:active { transform: scale(0.98); }
    .btn-logout { background: transparent; color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.2); font-weight: 600; margin-top: 20px; }
    .btn-logout:hover { background: rgba(239, 68, 68, 0.1); }

    .join-room-box { display: flex; gap: 12px; margin-top: 25px; justify-content: center; }
    .join-room-box input { margin-bottom: 0; width: 220px; border-radius: 16px; }
    .join-room-box button { width: auto; padding: 0 24px; margin: 0; background: var(--primary); color: white; border-radius: 16px; transition: 0.3s; }
    .join-room-box button:hover { background: var(--accent); box-shadow: var(--glow); }

    .call-container { width: 100vw; height: 100vh; height: 100dvh; display: flex; padding: 20px; gap: 20px; animation: fadeInUp 0.5s ease-out; }
    .video-section { flex: 1; display: flex; flex-direction: column; position: relative; min-width: 0; }
    
    /* Dynamic Video Grid for Multi-User */
    .video-grid { flex: 1; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); grid-auto-rows: minmax(200px, 1fr); gap: 20px; transition: all 0.3s ease; position: relative; overflow-y: auto; }
    
    .video-wrapper { position: relative; background: #000; border-radius: 24px; overflow: hidden; border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.2); transition: all 0.3s ease; min-height: 200px; }
    video { width: 100%; height: 100%; object-fit: cover; }
    .video-label { position: absolute; bottom: 20px; left: 20px; background: rgba(0,0,0,0.6); color: #fff; padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 600; backdrop-filter: blur(8px); z-index: 10; }

    video.flip { transform: scaleX(-1); }
    .flip-btn { position: absolute; top: 12px; right: 12px; z-index: 11; width: 34px; height: 34px; border-radius: 50%; border: none; cursor: pointer; background: rgba(0,0,0,0.55); color: #fff; font-size: 16px; backdrop-filter: blur(8px); }
    .flip-btn:hover { background: var(--primary); }
    .video-status { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; padding: 16px; color: #fff; font-size: 15px; font-weight: 600; background: rgba(0,0,0,0.55); z-index: 5; pointer-events: none; }
    .video-status.show { display: flex; }
    body.in-call .theme-toggle { display: none; }

    .controls { 
      position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); 
      display: flex; gap: 16px; background: var(--surface); backdrop-filter: blur(20px); 
      padding: 14px 28px; border-radius: 50px; border: 1px solid var(--border);
      box-shadow: 0 15px 35px rgba(0,0,0,0.2); align-items: center; z-index: 20;
      animation: fadeInUp 0.6s ease-out;
    }
    
    .ctrl-btn { 
      width: 60px; height: 60px; border-radius: 50%; border: none; cursor: pointer; 
      display: flex; justify-content: center; align-items: center; transition: 0.3s; 
      font-size: 24px; background: var(--input-bg); color: var(--text-main);
    }
    .ctrl-btn:hover { transform: scale(1.08); background: var(--border-hover); }
    .ctrl-btn:active { transform: scale(0.95); }
    .ctrl-btn.danger { background: #ef4444; color: white; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4); }
    .ctrl-btn.danger:hover { background: #dc2626; box-shadow: 0 6px 20px rgba(239, 68, 68, 0.6); }
    .ctrl-btn.active { background: var(--primary); color: white; box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4); }

    .sidebar { width: 380px; background: var(--surface); backdrop-filter: blur(24px); border: 1px solid var(--border); border-radius: 24px; display: flex; flex-direction: column; overflow: hidden; box-shadow: var(--shadow); }
    
    .sidebar-tabs { display: flex; border-bottom: 1px solid var(--border); background: var(--input-bg); }
    .sidebar-tabs button { flex: 1; padding: 18px; border: none; background: transparent; color: var(--text-muted); font-weight: 700; cursor: pointer; transition: 0.3s; font-size: 15px; border-bottom: 2px solid transparent; }
    .sidebar-tabs button.active { color: var(--text-main); border-bottom: 2px solid var(--primary); }
    .sidebar-tabs button.ai-tab.active { border-bottom: 2px solid var(--accent); color: var(--text-main); }

    .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
    .msg-bubble { max-width: 85%; padding: 12px 18px; border-radius: 20px; font-size: 14.5px; font-weight: 500; line-height: 1.5; word-wrap: break-word; animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    .msg-mine { align-self: flex-end; background: var(--chat-mine); color: #fff; border-bottom-right-radius: 4px; }
    .msg-other { align-self: flex-start; background: var(--chat-other); color: var(--text-main); border-bottom-left-radius: 4px; border: 1px solid var(--border); }
    .msg-ai { align-self: flex-start; background: linear-gradient(135deg, rgba(139, 92, 246, 0.1), rgba(217, 70, 239, 0.1)); border: 1px solid rgba(217, 70, 239, 0.2); color: var(--text-main); border-bottom-left-radius: 4px; }
    .msg-sender { font-size: 12px; font-weight: 700; opacity: 0.7; margin-bottom: 6px; display: block; }
    
    .chat-input-box { padding: 20px; border-top: 1px solid var(--border); display: flex; gap: 12px; background: var(--surface-solid); }
    .chat-input-box input { margin-bottom: 0; padding: 14px 18px; border-radius: 20px; background: var(--input-bg); }
    .chat-input-box button { background: var(--primary); color: #fff; border: none; border-radius: 50%; width: 48px; height: 48px; flex-shrink: 0; cursor: pointer; font-size: 18px; display: flex; justify-content: center; align-items: center; transition: 0.3s;}
    .chat-input-box button:hover { transform: scale(1.05); box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3); }
    .chat-input-box button.ai-send { background: var(--accent); box-shadow: 0 4px 15px rgba(217, 70, 239, 0.3); }
    
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: var(--border-hover); border-radius: 10px; }

    /* ===== Splash / orbs / logo ===== */
    .bg-orbs span { position: fixed; z-index: -1; border-radius: 50%; filter: blur(70px); opacity: .35; pointer-events: none; animation: floaty 14s ease-in-out infinite; }
    .bg-orbs span:nth-child(1) { width: 320px; height: 320px; background: var(--primary); top: -80px; left: -80px; }
    .bg-orbs span:nth-child(2) { width: 280px; height: 280px; background: var(--accent); bottom: -90px; right: -60px; animation-delay: -6s; }
    @keyframes floaty { 0%,100% { transform: translate(0,0); } 50% { transform: translate(40px,30px); } }

    .splash { position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center; background-color: var(--bg-color); background-image: var(--bg-gradient); transition: opacity .7s ease, transform .7s ease, visibility .7s; }
    .splash.out { opacity: 0; transform: scale(1.06); visibility: hidden; pointer-events: none; }
    .splash-inner { text-align: center; padding: 20px; }
    .logo-mark { width: 92px; height: 92px; margin: 0 auto 26px; border-radius: 28px; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, var(--primary), var(--accent)); box-shadow: 0 20px 50px -10px var(--primary), var(--glow); position: relative; animation: logoPop .9s cubic-bezier(.175,.885,.32,1.275) both; }
    .logo-mark::before, .logo-mark::after { content: ""; position: absolute; inset: 0; border-radius: 28px; border: 2px solid var(--primary); animation: ring 2.2s ease-out infinite; }
    .logo-mark::after { animation-delay: 1.1s; }
    .logo-mark svg { width: 44px; height: 44px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .logo-mark.sm { width: 56px; height: 56px; border-radius: 18px; margin-bottom: 18px; animation: none; }
    .logo-mark.sm::before, .logo-mark.sm::after { display: none; }
    .logo-mark.sm svg { width: 28px; height: 28px; }
    @keyframes logoPop { 0% { opacity: 0; transform: scale(.4) rotate(-12deg); } 100% { opacity: 1; transform: scale(1) rotate(0); } }
    @keyframes ring { 0% { opacity: .6; transform: scale(1); } 100% { opacity: 0; transform: scale(1.7); } }
    .splash-title { font-size: clamp(38px, 9vw, 64px); font-weight: 800; letter-spacing: 2px; display: flex; justify-content: center; }
    .splash-title span { display: inline-block; background: linear-gradient(135deg, var(--primary), var(--accent)); -webkit-background-clip: text; background-clip: text; color: transparent; opacity: 0; transform: translateY(24px); animation: letterIn .6s cubic-bezier(.2,.8,.2,1) forwards; }
    @keyframes letterIn { to { opacity: 1; transform: none; } }
    .splash-sub { color: var(--text-muted); margin-top: 10px; font-weight: 500; opacity: 0; animation: fadeInUp .8s ease 1.1s forwards; }
    .loader { width: 160px; height: 4px; border-radius: 4px; background: var(--border); margin: 34px auto 0; overflow: hidden; }
    .loader span { display: block; height: 100%; width: 0; border-radius: 4px; background: linear-gradient(90deg, var(--primary), var(--accent)); animation: load 2.4s ease forwards; }
    @keyframes load { to { width: 100%; } }

    /* ===== Password eye / OTP ===== */
    .pw-wrap { position: relative; }
    .pw-toggle { position: absolute; right: 12px; top: 25px; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 18px; padding: 6px; }
    .pw-wrap input { padding-right: 52px; }
    button.submit.loading { opacity: .7; pointer-events: none; }
    .otp-view { text-align: center; }
    .otp-icon { width: 72px; height: 72px; margin: 0 auto 18px; border-radius: 22px; display: flex; align-items: center; justify-content: center; font-size: 34px; background: rgba(139,92,246,.12); border: 1px solid rgba(139,92,246,.25); animation: popIn .5s ease; }
    .otp-view h2 { margin-bottom: 8px; }
    .otp-view .subtitle { margin-bottom: 26px; line-height: 1.5; }
    .otp-view .subtitle b { color: var(--text-main); word-break: break-all; }
    .otp-boxes { display: flex; gap: 10px; justify-content: center; margin: 0 0 22px; }
    .otp-boxes input { flex: 1 1 0; min-width: 0; max-width: 52px; width: auto; height: 58px; padding: 0; margin: 0; text-align: center; font-size: 24px; font-weight: 700; border-radius: 14px; }
    .otp-boxes input.filled { border-color: var(--primary); background: rgba(139,92,246,.1); }
    .otp-boxes input.error { border-color: #ef4444; animation: shake .4s; }
    @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
    .otp-links { margin-top: 16px; font-size: 14px; color: var(--text-muted); font-weight: 500; }
    .link-btn { background: none; border: none; color: var(--primary); font-weight: 700; cursor: pointer; font-size: 14px; }
    .link-btn:disabled { opacity: .5; cursor: not-allowed; }

    @media (max-width: 768px) {
      .call-container { flex-direction: column; padding: 10px; gap: 10px; }
      .video-section { flex: 2; min-height: 0; }
      .video-grid { grid-template-columns: repeat(2, 1fr); grid-auto-rows: minmax(110px, 1fr); gap: 8px; padding-bottom: 76px; }
      .video-grid[data-count="1"], .video-grid[data-count="2"] { grid-template-columns: 1fr; }
      .video-wrapper { border-radius: 16px; min-height: 110px; }
      .video-label { bottom: 8px; left: 8px; padding: 4px 10px; font-size: 11px; }
      .sidebar { width: 100%; flex: 1; border-radius: 20px; min-height: 0; }
      .chat-messages { padding: 12px; gap: 10px; }
      .chat-input-box { padding: 10px; }
      .controls { bottom: 8px; padding: 8px 14px; gap: 8px; width: max-content; max-width: 96%; }
      .ctrl-btn { width: 46px; height: 46px; font-size: 18px; }
      body.in-call .theme-toggle { display: none; }
      .auth-container { padding: 30px 20px; margin: 15px; }
      h2 { font-size: 28px; }
      .theme-toggle { top: 15px; left: 15px; width: 40px; height: 40px; }
    }
  </style>
</head>
<body data-theme="dark">

  <div class="bg-orbs"><span></span><span></span></div>

  <div id="splashView" class="splash">
    <div class="splash-inner">
      <div class="logo-mark"><svg viewBox="0 0 24 24"><rect x="2" y="6" width="13" height="12" rx="3"></rect><path d="M15 10l6-3v10l-6-3z"></path></svg></div>
      <h1 class="splash-title" id="splashTitle" aria-label="NISH-TALK"></h1>
      <p class="splash-sub">Connect with anyone, anywhere.</p>
      <div class="loader"><span></span></div>
    </div>
  </div>

  <button class="theme-toggle" id="themeToggle" title="Toggle Theme">
    <svg id="iconMoon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
    <svg id="iconSun" viewBox="0 0 24 24" style="display:none;"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
  </button>

  <div id="authView" class="auth-container hidden">
    <div class="logo-mark sm"><svg viewBox="0 0 24 24"><rect x="2" y="6" width="13" height="12" rx="3"></rect><path d="M15 10l6-3v10l-6-3z"></path></svg></div>
    <h2>NISH-TALK</h2>
    <p class="subtitle">Connect with anyone, anywhere.</p>
    <div class="tabs">
      <button id="loginTab" class="active" type="button">Login</button>
      <button id="signupTab" type="button">Sign Up</button>
    </div>

    <form id="loginForm" autocomplete="off">
      <input type="email" id="loginEmail" placeholder="Email" required />
      <div class="pw-wrap"><input type="password" id="loginPassword" placeholder="Password" required /><button type="button" class="pw-toggle" aria-label="Show password">👁️</button></div>
      <button type="submit" class="submit" id="loginBtn">Login to Nish-Talk</button>
    </form>

    <form id="signupForm" class="hidden" autocomplete="off">
      <input type="text" id="signupName" placeholder="Full Name" required />
      <input type="email" id="signupEmail" placeholder="Email" required />
      <div class="pw-wrap"><input type="password" id="signupPassword" placeholder="Password (min 6 chars)" minlength="6" required /><button type="button" class="pw-toggle" aria-label="Show password">👁️</button></div>
      <button type="submit" class="submit" id="signupBtn">Create Account</button>
    </form>

    <div id="message" class="message"></div>
  </div>

  <div id="otpView" class="auth-container otp-view hidden">
    <div class="otp-icon">📩</div>
    <h2>Verify your email</h2>
    <p class="subtitle">Enter the code we sent to<br><b id="otpEmailLabel"></b></p>
    <div class="otp-boxes" id="otpBoxes"></div>
    <button type="button" class="submit" id="verifyBtn">Verify &amp; Continue</button>
    <div id="otpMessage" class="message"></div>
    <div class="otp-links">Didn't get it? <button type="button" class="link-btn" id="resendBtn">Resend code</button></div>
    <div class="otp-links"><button type="button" class="link-btn" id="otpBackBtn">← Back</button></div>
  </div>

  <div id="dashboardView" class="auth-container dashboard hidden">
    <h2>Dashboard</h2>
    <span class="user-email" id="userEmail"></span>
    
    <div>
      <button class="action-btn btn-start" id="startCallBtn">Start Video Call</button>
    </div>
    
    <div class="join-room-box">
      <input type="text" id="joinRoomInput" placeholder="Enter Room ID" />
      <button class="action-btn btn-start" id="joinCallBtn" style="width:auto; margin:0; padding: 0 24px;">Join</button>
    </div>

    <div>
      <button class="action-btn btn-logout" id="logoutBtn">Log Out</button>
    </div>
  </div>

  <div id="callView" class="call-container hidden">
    <div class="video-section">
      <!-- Dynamic Video Grid -->
      <div class="video-grid" id="mainVideoGrid"></div>

      <div class="controls">
        <button class="ctrl-btn active" id="toggleMic" title="Mic On/Off">🎤</button>
        <button class="ctrl-btn active" id="toggleCam" title="Camera On/Off">📷</button>
        <button class="ctrl-btn" id="shareScreenBtn" title="Share Screen">🖥️</button>
        <button class="ctrl-btn" id="copyRoomId" title="Copy Room ID">🔗</button>
        <button class="ctrl-btn danger" id="endCallBtn" title="End Call">❌</button>
      </div>
    </div>

    <div class="sidebar">
      <div class="sidebar-tabs">
        <button id="roomChatTab" class="active">💬 Chat</button>
        <button id="aiChatTab" class="ai-tab">🤖 AI</button>
      </div>
      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-input-box">
        <input type="text" id="chatInput" placeholder="Type a message..." />
        <button id="sendMsgBtn">➤</button>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
    // ================== THEME LOGIC ==================
    const themeToggle = document.getElementById("themeToggle");
    const body = document.body;
    const iconMoon = document.getElementById("iconMoon");
    const iconSun = document.getElementById("iconSun");

    const savedTheme = localStorage.getItem("nish-talk-theme") || "dark";
    body.setAttribute("data-theme", savedTheme);
    if (savedTheme === "light") { iconMoon.style.display = "none"; iconSun.style.display = "block"; }

    themeToggle.addEventListener("click", () => {
      const currentTheme = body.getAttribute("data-theme");
      const newTheme = currentTheme === "dark" ? "light" : "dark";
      body.setAttribute("data-theme", newTheme);
      localStorage.setItem("nish-talk-theme", newTheme);
      if (newTheme === "light") { iconMoon.style.display = "none"; iconSun.style.display = "block"; } 
      else { iconMoon.style.display = "block"; iconSun.style.display = "none"; }
    });

    // ================== CONFIG ==================
    // Keys come from config.js (kept out of GitHub, see README / deploy.yml)
    const { SUPABASE_URL, SUPABASE_KEY } = window.NISH_CONFIG || {};

    const authView = document.getElementById("authView");
    const dashboardView = document.getElementById("dashboardView");
    const callView = document.getElementById("callView");
    
    const loginTab = document.getElementById("loginTab");
    const signupTab = document.getElementById("signupTab");
    const loginForm = document.getElementById("loginForm");
    const signupForm = document.getElementById("signupForm");
    const messageBox = document.getElementById("message");
    const userEmail = document.getElementById("userEmail");

    const roomChatTab = document.getElementById("roomChatTab");
    const aiChatTab = document.getElementById("aiChatTab");
    const chatMessages = document.getElementById("chatMessages");
    const chatInput = document.getElementById("chatInput");
    const sendMsgBtn = document.getElementById("sendMsgBtn");
    const shareBtn = document.getElementById("shareScreenBtn");
    const micBtn = document.getElementById("toggleMic");
    const camBtn = document.getElementById("toggleCam");

    let supabaseClient = null;
    let currentUser = null;
    let currentUserName = "User";

    // Multi-User Video Call Variables
    let localStream = null;
    let cameraStream = null;
    let screenStream = null;
    let screenTrack = null;
    let isScreenSharing = false;
    let currentRoom = null;
    let roomChannel = null;
    let myId = null; // unique per call/tab, so the same account can join from 2 tabs

    // STUN + free public TURN relay (TURN is needed when users are behind strict NAT / mobile data)
    // >>> APNA TURN YAHAN DAALO (free: metered.ca / cloudflare). Example:
    // const MY_TURN = [{ urls: ['turn:YOUR_HOST:80', 'turn:YOUR_HOST:443?transport=tcp'], username: 'USER', credential: 'PASS' }];
    const MY_TURN = [];

    const iceServers = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'stun:stun.cloudflare.com:3478' },
        { urls: ['turn:openrelay.metered.ca:80', 'turn:openrelay.metered.ca:443', 'turn:openrelay.metered.ca:443?transport=tcp'],
          username: 'openrelayproject', credential: 'openrelayproject' },
        ...MY_TURN
      ],
      iceCandidatePoolSize: 4
    };

    const peerConnections = new Map(); // peerId -> RTCPeerConnection
    const remoteStreams = new Map();   // peerId -> MediaStream
    const peerNames = new Map();       // peerId -> display name
    const pendingCandidates = new Map(); // peerId -> [ICE candidates received early]

    let activeChatTab = 'room';
    let roomMessages = [];
    let aiMessages = [];

    function esc(str) {
      return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    // ================== AUTH LOGIC ==================
    function showMessage(text, type) {
      messageBox.textContent = text;
      messageBox.className = "message " + type;
    }

    const OTP_LENGTH = 6; // must match "Email OTP Length" in Supabase (default 6)
    let splashDone = false, pendingView = 'auth';
    const splash = document.getElementById("splashView");
    document.getElementById("splashTitle").innerHTML = "NISH-TALK".split("").map((c, i) => `<span style="animation-delay:${0.25 + i * 0.09}s">${c}</span>`).join("");
    setTimeout(() => {
      splashDone = true;
      splash.classList.add("out");
      switchView(pendingView);
      setTimeout(() => splash.remove(), 900);
    }, 2800);

    function switchView(view) {
      if (!splashDone) { pendingView = view; return; }
      const map = { auth: authView, dashboard: dashboardView, call: callView, otp: otpView };
      Object.values(map).forEach(v => v.classList.add("hidden"));
      if (map[view]) map[view].classList.remove("hidden");
      body.classList.toggle("in-call", view === 'call');
    }

    loginTab.addEventListener("click", () => {
      loginTab.classList.add("active"); signupTab.classList.remove("active");
      loginForm.classList.remove("hidden"); signupForm.classList.add("hidden");
    });

    signupTab.addEventListener("click", () => {
      signupTab.classList.add("active"); loginTab.classList.remove("active");
      signupForm.classList.remove("hidden"); loginForm.classList.add("hidden");
    });

    try {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { realtime: { params: { eventsPerSecond: 100 } } });
      
      supabaseClient.auth.onAuthStateChange((_event, session) => {
        if (session) {
          currentUser = session.user;
          userEmail.textContent = currentUser.email;
          currentUserName = currentUser.user_metadata?.full_name || currentUser.email.split('@')[0];
          if (callView.classList.contains("hidden")) switchView('dashboard');
        } else {
          currentUser = null;
          endCall();
          switchView('auth');
        }
      });
    } catch (err) {
      console.error(err);
      showMessage("Supabase Init Error", "error");
    }

    const otpView = document.getElementById("otpView");
    const otpBoxes = document.getElementById("otpBoxes");
    const otpMsg = document.getElementById("otpMessage");
    const verifyBtn = document.getElementById("verifyBtn");
    const resendBtn = document.getElementById("resendBtn");
    let otpEmail = "", resendTimer = null, verifying = false;

    function setBtnLoading(btn, on, text) {
      if (on) { btn.dataset.t = btn.textContent; btn.textContent = text; btn.disabled = true; btn.classList.add("loading"); }
      else { btn.textContent = btn.dataset.t || btn.textContent; btn.disabled = false; btn.classList.remove("loading"); }
    }
    function showOtpMsg(text, type) { otpMsg.textContent = text; otpMsg.className = "message " + type; }

    // password show/hide
    document.querySelectorAll(".pw-toggle").forEach(btn => btn.addEventListener("click", () => {
      const inp = btn.previousElementSibling;
      inp.type = inp.type === "password" ? "text" : "password";
      btn.textContent = inp.type === "password" ? "👁️" : "🙈";
    }));

    // OTP boxes
    for (let i = 0; i < OTP_LENGTH; i++) {
      const inp = document.createElement("input");
      inp.type = "text"; inp.inputMode = "numeric"; inp.maxLength = 1; inp.autocomplete = "off";
      inp.setAttribute("aria-label", "Digit " + (i + 1));
      otpBoxes.appendChild(inp);
    }
    const boxes = [...otpBoxes.children];
    const getOtp = () => boxes.map(b => b.value).join("");
    function clearOtp() { boxes.forEach(b => { b.value = ""; b.classList.remove("filled", "error"); }); boxes[0].focus(); }

    boxes.forEach((b, i) => {
      b.addEventListener("input", () => {
        b.value = b.value.replace(/\D/g, "").slice(-1);
        b.classList.toggle("filled", !!b.value); b.classList.remove("error");
        if (b.value && i < boxes.length - 1) boxes[i + 1].focus();
        if (getOtp().length === OTP_LENGTH) submitOtp();
      });
      b.addEventListener("keydown", (e) => {
        if (e.key === "Backspace" && !b.value && i > 0) { boxes[i - 1].focus(); boxes[i - 1].value = ""; boxes[i - 1].classList.remove("filled"); }
        if (e.key === "ArrowLeft" && i > 0) boxes[i - 1].focus();
        if (e.key === "ArrowRight" && i < boxes.length - 1) boxes[i + 1].focus();
        if (e.key === "Enter") submitOtp();
      });
      b.addEventListener("paste", (e) => {
        e.preventDefault();
        const t = (e.clipboardData.getData("text") || "").replace(/\D/g, "").slice(0, OTP_LENGTH);
        t.split("").forEach((ch, k) => { boxes[k].value = ch; boxes[k].classList.add("filled"); });
        boxes[Math.min(t.length, boxes.length - 1)].focus();
        if (t.length === OTP_LENGTH) submitOtp();
      });
    });

    function startCooldown(sec) {
      clearInterval(resendTimer);
      let left = sec;
      resendBtn.disabled = true; resendBtn.textContent = `Resend in ${left}s`;
      resendTimer = setInterval(() => {
        left--;
        if (left <= 0) { clearInterval(resendTimer); resendBtn.disabled = false; resendBtn.textContent = "Resend code"; }
        else resendBtn.textContent = `Resend in ${left}s`;
      }, 1000);
    }

    function showOtp(email) {
      otpEmail = email;
      document.getElementById("otpEmailLabel").textContent = email;
      otpMsg.className = "message";
      messageBox.className = "message";
      clearOtp();
      switchView('otp');
      startCooldown(60);
      setTimeout(() => boxes[0].focus(), 300);
    }

    async function submitOtp() {
      const code = getOtp();
      if (verifying) return;
      if (code.length < OTP_LENGTH) return showOtpMsg(`Enter all ${OTP_LENGTH} digits`, "error");
      verifying = true; setBtnLoading(verifyBtn, true, "Verifying...");
      const { error } = await supabaseClient.auth.verifyOtp({ email: otpEmail, token: code, type: 'signup' });
      verifying = false; setBtnLoading(verifyBtn, false);
      if (error) {
        boxes.forEach(b => b.classList.add("error"));
        showOtpMsg(/expired|invalid/i.test(error.message) ? "Wrong or expired code. Try again or resend." : error.message, "error");
        setTimeout(clearOtp, 700);
      } else {
        showOtpMsg("Email verified! Taking you in… ✅", "success");
        // onAuthStateChange moves the user to the dashboard
      }
    }

    verifyBtn.addEventListener("click", submitOtp);
    resendBtn.addEventListener("click", async () => {
      resendBtn.disabled = true;
      const { error } = await supabaseClient.auth.resend({ type: 'signup', email: otpEmail });
      if (error) { showOtpMsg(error.message, "error"); resendBtn.disabled = false; }
      else { showOtpMsg("New code sent ✉️", "success"); startCooldown(60); clearOtp(); }
    });
    document.getElementById("otpBackBtn").addEventListener("click", () => { clearInterval(resendTimer); switchView('auth'); });

    signupForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("signupBtn");
      const email = document.getElementById("signupEmail").value.trim();
      btn.disabled = true; btn.textContent = "Creating...";
      const { data, error } = await supabaseClient.auth.signUp({
        email,
        password: document.getElementById("signupPassword").value,
        options: { data: { full_name: document.getElementById("signupName").value.trim() } }
      });
      btn.disabled = false; btn.textContent = "Create Account";
      if (error) return showMessage(error.message, "error");
      if (data.user && data.user.identities && data.user.identities.length === 0) {
        return showMessage("This email is already registered. Please log in.", "error");
      }
      if (!data.session) showOtp(email); // email confirmation ON -> ask for the code
    });

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("loginBtn");
      const email = document.getElementById("loginEmail").value.trim();
      btn.disabled = true; btn.textContent = "Logging in...";
      const { error } = await supabaseClient.auth.signInWithPassword({
        email,
        password: document.getElementById("loginPassword").value
      });
      btn.disabled = false; btn.textContent = "Login to Nish-Talk";
      if (error) {
        if (/not confirmed/i.test(error.message)) {
          await supabaseClient.auth.resend({ type: 'signup', email });
          showOtp(email); // unverified account -> send a fresh code
        } else showMessage(error.message, "error");
      }
    });

    document.getElementById("logoutBtn").addEventListener("click", async () => { await supabaseClient.auth.signOut(); });

    // ================== CHAT & AI TAB SWITCHING ==================
    function renderChat() {
      chatMessages.innerHTML = "";
      const msgs = activeChatTab === 'room' ? roomMessages : aiMessages;
      
      if (msgs.length === 0) {
        chatMessages.innerHTML = `<div style="text-align:center; color:var(--text-muted); margin-top:20px; font-size:14px; font-weight: 500;">No messages yet. Say hi! 👋</div>`;
      } else {
        msgs.forEach(msg => {
          const div = document.createElement("div");
          div.className = `msg-bubble msg-${msg.type}`;
          let senderLabel = "";
          if (msg.type === 'other') senderLabel = `<span class="msg-sender">${esc(msg.sender)}</span>`;
          if (msg.type === 'ai') senderLabel = `<span class="msg-sender" style="color:var(--accent);">🤖 NISH-AI</span>`;
          const content = msg.raw ? msg.text : esc(msg.text).replace(/\n/g, "<br>");
          div.innerHTML = `${senderLabel}${content}`;
          chatMessages.appendChild(div);
        });
      }
      chatMessages.scrollTop = chatMessages.scrollHeight;
      if (activeChatTab === 'ai') { chatInput.placeholder = "Ask AI anything..."; sendMsgBtn.classList.add("ai-send"); } 
      else { chatInput.placeholder = "Type a message..."; sendMsgBtn.classList.remove("ai-send"); }
    }

    roomChatTab.addEventListener("click", () => { activeChatTab = 'room'; roomChatTab.classList.add("active"); aiChatTab.classList.remove("active"); renderChat(); });
    aiChatTab.addEventListener("click", () => { activeChatTab = 'ai'; aiChatTab.classList.add("active"); roomChatTab.classList.remove("active"); renderChat(); });

    sendMsgBtn.addEventListener("click", sendChatMessage);
    chatInput.addEventListener("keydown", (e) => { if (e.key === "Enter") sendChatMessage(); });

    function sendChatMessage() {
      const text = chatInput.value.trim();
      if (!text) return;
      chatInput.value = "";
      if (activeChatTab === 'room') {
        if (!roomChannel) return;
        roomMessages.push({ sender: currentUserName, text: text, type: 'mine' });
        renderChat();
        roomChannel.send({ type: 'broadcast', event: 'chat_msg', payload: { senderName: currentUserName, text: text } });
      } else {
        aiMessages.push({ text: text, type: 'mine' });
        renderChat();
        fetchAIReply(text);
      }
    }

    // ================== VIDEO GRID MANAGEMENT ==================
    function addVideoElement(peerId, name, isLocal = false) {
      const grid = document.getElementById("mainVideoGrid");
      let wrapper = document.getElementById(`video-wrap-${peerId}`);

      if (!wrapper) {
        wrapper = document.createElement("div");
        wrapper.className = "video-wrapper";
        wrapper.id = `video-wrap-${peerId}`;

        const video = document.createElement("video");
        video.id = `video-${peerId}`;
        video.autoplay = true;
        video.playsInline = true;
        if (isLocal) video.muted = true;

        const label = document.createElement("div");
        label.className = "video-label";

        wrapper.appendChild(video);
        wrapper.appendChild(label);
        const st = document.createElement("div");
        st.className = "video-status";
        wrapper.appendChild(st);
        video.classList.add("flip");
        const fb = document.createElement("button");
        fb.className = "flip-btn"; fb.type = "button"; fb.title = "Flip video"; fb.textContent = "↔";
        fb.addEventListener("click", (e) => { e.stopPropagation(); video.classList.toggle("flip"); });
        wrapper.appendChild(fb);
        if (!isLocal) video.addEventListener("playing", () => setPeerStatus(peerId, ""));
        grid.appendChild(wrapper);
      }

      wrapper.dataset.name = isLocal ? "You" : (name || "Guest");
      wrapper.querySelector(".video-label").textContent = wrapper.dataset.name + (wrapper.dataset.status ? " • " + wrapper.dataset.status : "");
      updateGrid();

      const video = wrapper.querySelector("video");
      const stream = isLocal ? localStream : remoteStreams.get(peerId);
      if (stream && video.srcObject !== stream) {
        video.srcObject = stream;
        safePlay(video);
      }
    }

    function removeVideoElement(peerId) {
      const wrapper = document.getElementById(`video-wrap-${peerId}`);
      if (wrapper) wrapper.remove();
      updateGrid();
    }

    function updateGrid() {
      const g = document.getElementById("mainVideoGrid");
      g.dataset.count = g.children.length;
    }

    function setPeerStatus(id, status) {
      const w = document.getElementById(`video-wrap-${id}`);
      if (!w) return;
      w.dataset.status = status || "";
      const ov = w.querySelector(".video-status");
      if (ov) { ov.textContent = status || ""; ov.classList.toggle("show", !!status); }
      w.querySelector(".video-label").textContent = (w.dataset.name || "Guest") + (status ? " • " + status : "");
    }

    // Mobile browsers sometimes block autoplay: any tap starts all paused videos
    function safePlay(v) {
      const pr = v.play();
      if (pr && pr.catch) pr.catch(() => { v.dataset.autoMuted = "1"; v.muted = true; v.play().catch(() => {}); });
    }
    document.addEventListener("click", () => {
      document.querySelectorAll("video").forEach(v => {
        if (v.dataset.autoMuted && !v.id.endsWith(myId)) { v.muted = false; delete v.dataset.autoMuted; }
        if (v.paused && v.srcObject) v.play().catch(() => {});
      });
    });

    // ================== MULTI-USER WEBRTC LOGIC ==================
    document.getElementById("startCallBtn").addEventListener("click", () => {
      startVideoCall(Math.random().toString(36).substring(2, 8).toUpperCase());
    });
    document.getElementById("joinCallBtn").addEventListener("click", () => {
      const roomId = document.getElementById("joinRoomInput").value.trim().toUpperCase();
      if (!roomId) return alert("Please enter a Room ID");
      startVideoCall(roomId);
    });

    async function getMedia() {
      try {
        return await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      } catch (err) {
        // Fallback: no camera -> audio only
        alert("Camera nahi mila (shayad kisi aur app/browser mein use ho raha hai). Sirf audio se join ho rahe ho.");
        return await navigator.mediaDevices.getUserMedia({ video: false, audio: true });
      }
    }

    async function startVideoCall(roomId) {
      if (!currentUser) return;
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        return alert("Camera/mic not available. Open this page over HTTPS (or localhost).");
      }

      try {
        cameraStream = await getMedia();
        localStream = cameraStream;
      } catch (err) {
        console.error("Media error:", err);
        alert("Could not access camera/mic. Please allow permissions.");
        return;
      }

      currentRoom = roomId;
      myId = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : (Date.now().toString(36) + Math.random().toString(36).slice(2));
      switchView('call');

      document.getElementById("mainVideoGrid").innerHTML = "";
      peerConnections.clear(); remoteStreams.clear(); peerNames.clear(); pendingCandidates.clear(); retryCount.clear();
      roomMessages = []; aiMessages = [];
      activeChatTab = 'room'; roomChatTab.classList.add("active"); aiChatTab.classList.remove("active");
      renderChat();

      // reset control buttons
      micBtn.classList.add("active"); micBtn.classList.remove("danger"); micBtn.textContent = "🎤";
      camBtn.classList.add("active"); camBtn.classList.remove("danger"); camBtn.textContent = "📷";

      addVideoElement(myId, currentUserName, true);

      roomChannel = supabaseClient.channel(`room_${roomId}`, {
        config: { broadcast: { self: false }, presence: { key: myId } }
      });

      // --- Presence: tells us exactly who is in the room (including people already there) ---
      roomChannel.on('presence', { event: 'join' }, ({ key, newPresences }) => {
        if (key === myId) return;
        const name = (newPresences && newPresences[0] && newPresences[0].name) || "Guest";
        registerPeer(key, name);
      });

      roomChannel.on('presence', { event: 'leave' }, ({ key }) => {
        if (key !== myId) removePeer(key);
      });

      // --- Signaling (addressed to a specific peer) ---
      roomChannel.on('broadcast', { event: 'webrtc_signal' }, async ({ payload }) => {
        const { signal, sender, target } = payload;
        if (target !== myId || sender === myId) return;

        try {
          if (signal.type === 'reset') {
            resetPeer(sender, false);
          } else if (signal.type === 'offer') {
            await handleOffer(signal, sender);
          } else if (signal.type === 'answer') {
            const pc = peerConnections.get(sender);
            if (pc && pc.signalingState === 'have-local-offer') {
              await pc.setRemoteDescription(new RTCSessionDescription(signal));
              await flushCandidates(sender);
            }
          } else if (signal.candidate) {
            const pc = peerConnections.get(sender);
            if (pc && pc.remoteDescription) {
              await pc.addIceCandidate(new RTCIceCandidate(signal));
            } else {
              if (!pendingCandidates.has(sender)) pendingCandidates.set(sender, []);
              pendingCandidates.get(sender).push(signal);
            }
          }
        } catch (err) { console.error("Signal error:", err); }
      });

      // --- Backup discovery (works even if Presence is slow/disabled) ---
      roomChannel.on('broadcast', { event: 'hello' }, ({ payload }) => {
        if (!payload || payload.id === myId) return;
        registerPeer(payload.id, payload.name);
        if (payload.reply) sendHello(false);
      });
      roomChannel.on('broadcast', { event: 'bye' }, ({ payload }) => {
        if (payload && payload.id !== myId) removePeer(payload.id);
      });

      roomChannel.on('broadcast', { event: 'chat_msg' }, ({ payload }) => {
        const { senderName, text } = payload;
        roomMessages.push({ sender: senderName, text: text, type: 'other' });
        if (activeChatTab === 'room') renderChat();
      });

      roomChannel.subscribe(async (status) => {
        if (status === 'SUBSCRIBED') {
          await roomChannel.track({ name: currentUserName });
          sendHello(true);
          clearInterval(helloTimer);
          helloTimer = setInterval(() => {
            if (!roomChannel) return;
            const anyConnected = [...peerConnections.values()].some(p => p.connectionState === 'connected');
            if (!anyConnected) sendHello(true);
            // retry offers that never went out
            peerNames.forEach((n, id) => { if (!peerConnections.has(id) && myId < id) createOfferForPeer(id); });
          }, 4000);
        } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
          console.error("Realtime channel problem:", status);
        }
      });
    }

    let helloTimer = null;
    const retryCount = new Map();

    function sendHello(reply) {
      if (!roomChannel) return;
      roomChannel.send({ type: 'broadcast', event: 'hello', payload: { id: myId, name: currentUserName, reply: !!reply } });
    }

    function registerPeer(id, name) {
      if (!id || id === myId) return;
      peerNames.set(id, name || "Guest");
      addVideoElement(id, peerNames.get(id), false);
      if (!peerConnections.has(id)) setPeerStatus(id, "connecting…");
      // Tie-breaker: only ONE side sends the offer
      if (myId < id) createOfferForPeer(id);
    }

    function resetPeer(peerId, notify) {
      const pc = peerConnections.get(peerId);
      if (pc) { pc.onicecandidate = null; pc.ontrack = null; pc.onconnectionstatechange = null; pc.close(); }
      peerConnections.delete(peerId); remoteStreams.delete(peerId); pendingCandidates.delete(peerId);
      if (notify) sendSignal(peerId, { type: 'reset' });
      setPeerStatus(peerId, "reconnecting…");
      if (myId < peerId) setTimeout(() => { if (roomChannel && peerNames.has(peerId)) createOfferForPeer(peerId); }, 800);
    }

    async function flushCandidates(peerId) {
      const pc = peerConnections.get(peerId);
      const list = pendingCandidates.get(peerId) || [];
      pendingCandidates.delete(peerId);
      for (const c of list) {
        try { await pc.addIceCandidate(new RTCIceCandidate(c)); } catch (e) { console.error(e); }
      }
    }

    function waitForIce(pc, ms = 4000) {
      return new Promise(resolve => {
        if (pc.iceGatheringState === 'complete') return resolve();
        const check = () => { if (pc.iceGatheringState === 'complete') done(); };
        const done = () => { pc.removeEventListener('icegatheringstatechange', check); clearTimeout(t); resolve(); };
        const t = setTimeout(done, ms);
        pc.addEventListener('icegatheringstatechange', check);
      });
    }

    function sendSignal(target, signal) {
      if (!roomChannel) return;
      roomChannel.send({ type: 'broadcast', event: 'webrtc_signal', payload: { signal, sender: myId, target } });
    }

    function createPeerConnection(peerId) {
      if (peerConnections.has(peerId)) return peerConnections.get(peerId);

      const pc = new RTCPeerConnection(iceServers);
      peerConnections.set(peerId, pc);

      // Add local tracks
      localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

      // If we're already sharing our screen, new peers should see the screen
      if (isScreenSharing && screenTrack) {
        const vs = pc.getSenders().find(s => s.track && s.track.kind === 'video');
        if (vs) vs.replaceTrack(screenTrack);
      }

      // Show tile for the peer
      addVideoElement(peerId, peerNames.get(peerId) || "Guest", false);

      // Remote stream
      pc.ontrack = (event) => {
        const stream = event.streams[0] || new MediaStream([event.track]);
        remoteStreams.set(peerId, stream);
        addVideoElement(peerId, peerNames.get(peerId) || "Guest", false);
        setPeerStatus(peerId, "");
        const v = document.getElementById(`video-${peerId}`);
        if (v) { v.srcObject = stream; safePlay(v); }
      };

      pc.onicecandidate = (event) => {
        /* non-trickle: candidates are bundled inside the SDP */
      };

      setPeerStatus(peerId, "connecting…");
      const watchdog = setInterval(() => {
        if (peerConnections.get(peerId) !== pc) return clearInterval(watchdog);
        if (pc.connectionState === 'connected') return clearInterval(watchdog);
        const info = `[ice: ${pc.iceConnectionState}, signal: ${pc.signalingState}]`;
        if (myId < peerId && (retryCount.get(peerId) || 0) < 3) {
          retryCount.set(peerId, (retryCount.get(peerId) || 0) + 1);
          clearInterval(watchdog);
          setPeerStatus(peerId, "dobara try ho raha hai… " + info);
          resetPeer(peerId, true);
        } else {
          setPeerStatus(peerId, "Connect nahi ho paa raha " + info);
        }
      }, 12000);
      pc.oniceconnectionstatechange = () => console.log("ICE", peerId, pc.iceConnectionState);
      pc.onconnectionstatechange = () => {
        const st = pc.connectionState;
        if (st === 'connected') setPeerStatus(peerId, "");
        else if (st === 'failed') resetPeer(peerId, true);
        else if (st === 'disconnected') setPeerStatus(peerId, "weak connection…");
        else setPeerStatus(peerId, "connecting…");
      };

      return pc;
    }

    async function createOfferForPeer(peerId) {
      if (peerConnections.has(peerId)) return;
      try {
        const pc = createPeerConnection(peerId);
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        await waitForIce(pc);
        sendSignal(peerId, { type: pc.localDescription.type, sdp: pc.localDescription.sdp });
      } catch (err) { console.error("Offer error:", err); }
    }

    async function handleOffer(offer, senderId) {
      const pc = createPeerConnection(senderId);
      await pc.setRemoteDescription(new RTCSessionDescription(offer));
      await flushCandidates(senderId);
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      await waitForIce(pc);
      sendSignal(senderId, { type: pc.localDescription.type, sdp: pc.localDescription.sdp });
    }

    function removePeer(peerId) {
      const pc = peerConnections.get(peerId);
      if (pc) { pc.onicecandidate = null; pc.ontrack = null; pc.close(); }
      peerConnections.delete(peerId);
      remoteStreams.delete(peerId);
      peerNames.delete(peerId);
      pendingCandidates.delete(peerId);
      removeVideoElement(peerId);
    }

    // ================== SCREEN SHARING (Solo & Group) ==================
    function setVideoTrackForAll(track) {
      peerConnections.forEach(pc => {
        const sender = pc.getSenders().find(s => s.track && s.track.kind === 'video');
        if (sender && track) sender.replaceTrack(track);
      });
    }

    function stopScreenShare() {
      if (!isScreenSharing) return;
      isScreenSharing = false;
      if (screenStream) { screenStream.getTracks().forEach(t => t.stop()); }
      screenStream = null; screenTrack = null;
      shareBtn.classList.remove("active"); shareBtn.title = "Share Screen";
      if (cameraStream) {
        const camTrack = cameraStream.getVideoTracks()[0];
        setVideoTrackForAll(camTrack);
        const lv = document.getElementById(`video-${myId}`);
        if (lv) { lv.srcObject = cameraStream; lv.classList.add("flip"); }
      }
    }

    shareBtn.addEventListener("click", async () => {
      if (!localStream) return;
      if (isScreenSharing) return stopScreenShare();
      if (!navigator.mediaDevices.getDisplayMedia) return alert("Screen sharing is not supported on this device/browser.");
      try {
        screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
        screenTrack = screenStream.getVideoTracks()[0];
        setVideoTrackForAll(screenTrack);
        const lv = document.getElementById(`video-${myId}`);
        if (lv) { lv.srcObject = screenStream; lv.classList.remove("flip"); }
        isScreenSharing = true; shareBtn.classList.add("active"); shareBtn.title = "Stop Sharing";
        screenTrack.onended = stopScreenShare;
      } catch (err) { console.log("Screen share error:", err); }
    });

    // ================== AI LOGIC ==================
    async function fetchAIReply(prompt) {
      aiMessages.push({ text: `<i>Thinking...</i>`, type: 'ai', raw: true });
      if (activeChatTab === 'ai') renderChat();
      try {
        const response = await fetch(`https://text.pollinations.ai/openai`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ model: "openai", max_tokens: 200,
            messages: [
              { role: "system", content: "Reply very briefly: max 2-3 short sentences, no long lists. Use the same language as the user." },
              { role: "user", content: prompt }
            ] })
        });
        if (!response.ok) throw new Error("AI service error");
        const data = await response.json();
        const aiText = data.choices[0].message.content;
        aiMessages.pop(); 
        aiMessages.push({ text: aiText, type: 'ai' });
      } catch (err) {
        console.error("AI Error:", err);
        aiMessages.pop();
        aiMessages.push({ text: "Sorry, I am facing network issues right now.", type: 'ai' });
      }
      if (activeChatTab === 'ai') renderChat();
    }

    // ================== CONTROLS ==================
    document.getElementById("copyRoomId").addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(currentRoom); } catch (e) {}
      alert(`Room ID: ${currentRoom}\nShare this with the other person!`);
    });
    document.getElementById("endCallBtn").addEventListener("click", endCall);
    window.addEventListener("beforeunload", () => { if (roomChannel) { try { roomChannel.send({ type: 'broadcast', event: 'bye', payload: { id: myId } }); roomChannel.untrack(); } catch (e) {} } });

    function endCall() {
      const wasInCall = !!(roomChannel || localStream);

      if (isScreenSharing) {
        isScreenSharing = false;
        if (screenStream) screenStream.getTracks().forEach(t => t.stop());
        screenStream = null; screenTrack = null;
      }
      if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
      if (cameraStream) { cameraStream.getTracks().forEach(t => t.stop()); cameraStream = null; }

      peerConnections.forEach(pc => { pc.onicecandidate = null; pc.ontrack = null; pc.close(); });
      peerConnections.clear(); remoteStreams.clear(); peerNames.clear(); pendingCandidates.clear();

      clearInterval(helloTimer); helloTimer = null;
      if (roomChannel) {
        try { roomChannel.send({ type: 'broadcast', event: 'bye', payload: { id: myId } }); } catch (e) {}
        try { roomChannel.untrack(); } catch (e) {}
        supabaseClient.removeChannel(roomChannel);
        roomChannel = null;
      }

      document.getElementById("mainVideoGrid").innerHTML = "";
      shareBtn.classList.remove("active");
      currentRoom = null; myId = null;
      if (currentUser && wasInCall) switchView('dashboard');
    }

    micBtn.addEventListener("click", () => {
      if (!localStream) return;
      const track = localStream.getAudioTracks()[0];
      if (!track) return;
      track.enabled = !track.enabled;
      micBtn.classList.toggle("active", track.enabled); micBtn.classList.toggle("danger", !track.enabled);
      micBtn.textContent = track.enabled ? "🎤" : "🔇";
    });

    camBtn.addEventListener("click", () => {
      if (!cameraStream || isScreenSharing) return;
      const track = cameraStream.getVideoTracks()[0];
      if (!track) return;
      track.enabled = !track.enabled;
      camBtn.classList.toggle("active", track.enabled); camBtn.classList.toggle("danger", !track.enabled);
      camBtn.textContent = track.enabled ? "📷" : "🚫";
    });

  </script>
</body>
